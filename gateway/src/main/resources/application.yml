# Los secretos y las direcciones de los servicios se leen del archivo .env en la raíz del gateway.
# Copia .env.example como .env y completa sus valores.
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: rinde-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Un servicio que no responde a tiempo se informa como 503.
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
          routes:
            # Orden explícito: las rutas más específicas van antes que los comodines.
            - id: platform-identity
              uri: ${IAM_SERVICE_URL:http://localhost:8081}
              order: 0
              predicates:
                - Path=/api/v1/platform/auth/**,/api/v1/platform/me,/api/v1/platform/overview,/api/v1/platform/companies/**,/api/v1/platform/audit/identity,/api/v1/platform/demo-mailbox/**
            - id: platform-billing
              uri: ${MONOLITH_URL:http://localhost:8080}
              order: 1
              predicates:
                - Path=/api/v1/platform/billing/**,/api/v1/platform/plans/**,/api/v1/platform/subscriptions/**,/api/v1/platform/payments/**,/api/v1/platform/audit/billing
            - id: iam-service
              uri: ${IAM_SERVICE_URL:http://localhost:8081}
              order: 1
              predicates:
                - Path=/api/v1/auth/**,/api/v1/tenants/**,/api/v1/users/**,/api/v1/demo/features
            - id: iam-api-docs
              uri: ${IAM_SERVICE_URL:http://localhost:8081}
              order: 2
              predicates:
                - Path=/v3/api-docs/iam
              filters:
                - RewritePath=/v3/api-docs/iam,/v3/api-docs
            - id: monolith-api-docs
              uri: ${MONOLITH_URL:http://localhost:8080}
              order: 3
              predicates:
                - Path=/v3/api-docs/monolith
              filters:
                - RewritePath=/v3/api-docs/monolith,/v3/api-docs
            # Solo sirve para que PathGuardGlobalFilter responda 404; nunca se reenvía.
            - id: internal-denied
              uri: ${IAM_SERVICE_URL:http://localhost:8081}
              order: 4
              predicates:
                - Path=/api/internal/**
            # Expense y Settlement siguen en el monolito; van antes que el resto de /trips.
            - id: monolith-trip-children
              uri: ${MONOLITH_URL:http://localhost:8080}
              order: 5
              predicates:
                - Path=/api/v1/trips/*/expenses/**,/api/v1/trips/*/settlement/**
            - id: trip-service
              uri: ${TRIP_SERVICE_URL:http://localhost:8082}
              order: 6
              predicates:
                - Path=/api/v1/trips/**
            - id: trip-api-docs
              uri: ${TRIP_SERVICE_URL:http://localhost:8082}
              order: 7
              predicates:
                - Path=/v3/api-docs/trip
              filters:
                - RewritePath=/v3/api-docs/trip,/v3/api-docs
            - id: fleet-service
              uri: ${FLEET_SERVICE_URL:http://localhost:8083}
              order: 8
              predicates:
                - Path=/api/v1/vehicles/**,/api/v1/drivers/**,/api/v1/maintenances/**
            - id: fleet-api-docs
              uri: ${FLEET_SERVICE_URL:http://localhost:8083}
              order: 9
              predicates:
                - Path=/v3/api-docs/fleet
              filters:
                - RewritePath=/v3/api-docs/fleet,/v3/api-docs
            - id: monolith-service
              uri: ${MONOLITH_URL:http://localhost:8080}
              order: 10
              predicates:
                - Path=/api/v1/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,X-Correlation-Id
                exposed-headers: X-Correlation-Id
                max-age: 3600

rinde:
  platform:
    jwt:
      secret: ${RINDE_PLATFORM_JWT_SECRET:}
    bootstrap:
      enabled: ${RINDE_PLATFORM_BOOTSTRAP_ENABLED:false}
      name: ${RINDE_PLATFORM_BOOTSTRAP_NAME:}
      email: ${RINDE_PLATFORM_BOOTSTRAP_EMAIL:}
      password: ${RINDE_PLATFORM_BOOTSTRAP_PASSWORD:}
  security:
    jwt:
      # Mínimo 32 caracteres. Debe ser el mismo secreto que usan IAM y el monolito.
      secret: ${JWT_SECRET}

server:
  port: 8000

springdoc:
  # Ruta distinta de /v3/api-docs/{grupo}, que queda libre para las rutas de IAM y del monolito.
  api-docs:
    path: /v3/gateway-api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    urls:
      - name: IAM y Tenancy
        url: /v3/api-docs/iam
      - name: Viajes
        url: /v3/api-docs/trip
      - name: Flota
        url: /v3/api-docs/fleet
      - name: Monolito
        url: /v3/api-docs/monolith

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
