# Los secretos y los datos de conexión se leen del archivo .env en la raíz del servicio.
# Copia .env.example como .env y completa sus valores.
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: rinde-iam-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rinde_iam}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  # El esquema iam se migra con Flyway desde IamFlywayConfiguration.
  flyway:
    enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 200ms
          multiplier: 2
          max-interval: 2s

server:
  port: 8081

rinde:
  messaging:
    exchange: ${RINDE_EVENTS_EXCHANGE:rinde.events}
    subscription:
      queue: ${RINDE_IAM_SUBSCRIPTION_QUEUE:iam.subscription-events}
  security:
    jwt:
      # Mínimo 32 caracteres. Debe ser el mismo secreto que usa el monolito para validar los tokens.
      secret: ${JWT_SECRET}
      expiration-hours: 8
  iam:
    tokens:
      invitation-validity-hours: 48
      password-reset-validity-hours: 1
      email-verification-validity-hours: 48
  web:
    # URL del frontend Angular; los enlaces del log de DEBUG apuntan a ella.
    base-url: ${WEB_BASE_URL:http://localhost:4200}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
