name: rinde-services
services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Configurar RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Configurar RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  postgres-core:
    image: postgres:17
    environment:
      POSTGRES_DB: rinde
      POSTGRES_USER: rinde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinde -d rinde"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-core-data:/var/lib/postgresql/data
  core:
    image: rinde/core:${CORE_VERSION:-0.3.0}
    build:
      context: .
      dockerfile: services/core/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres-core:5432/rinde
      DB_USERNAME: rinde
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Configurar JWT_SECRET}
      RINDE_PLATFORM_JWT_SECRET: ${RINDE_PLATFORM_JWT_SECRET:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Configurar RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Configurar RABBITMQ_PASSWORD}
      RINDE_IAM_REMOTE_ENABLED: "true"
      IAM_SERVICE_URL: http://iam:8081
      RINDE_BILLING_SIMULATION_ENABLED: ${RINDE_BILLING_SIMULATION_ENABLED:-false}
      RINDE_BILLING_SIMULATION_WEBHOOK_SECRET: ${RINDE_BILLING_SIMULATION_WEBHOOK_SECRET:?Configurar RINDE_BILLING_SIMULATION_WEBHOOK_SECRET}
    ports:
      - "127.0.0.1:${CORE_PORT:-8080}:8080"
    depends_on:
      postgres-core:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  postgres-iam:
    image: postgres:17
    environment:
      POSTGRES_DB: rinde_iam
      POSTGRES_USER: rinde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinde -d rinde_iam"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-iam-data:/var/lib/postgresql/data
  iam:
    image: rinde/iam:${IAM_VERSION:-0.2.0}
    build:
      context: .
      dockerfile: services/iam/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres-iam:5432/rinde_iam
      DB_USERNAME: rinde
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Configurar JWT_SECRET}
      RINDE_PLATFORM_JWT_SECRET: ${RINDE_PLATFORM_JWT_SECRET:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Configurar RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Configurar RABBITMQ_PASSWORD}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:4200}
      RINDE_PLATFORM_BOOTSTRAP_ENABLED: ${RINDE_PLATFORM_BOOTSTRAP_ENABLED:-false}
      RINDE_PLATFORM_BOOTSTRAP_NAME: ${RINDE_PLATFORM_BOOTSTRAP_NAME:-}
      RINDE_PLATFORM_BOOTSTRAP_EMAIL: ${RINDE_PLATFORM_BOOTSTRAP_EMAIL:-}
      RINDE_PLATFORM_BOOTSTRAP_PASSWORD: ${RINDE_PLATFORM_BOOTSTRAP_PASSWORD:-}
    ports:
      - "127.0.0.1:${IAM_PORT:-8081}:8081"
    depends_on:
      postgres-iam:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  postgres-trip:
    image: postgres:17
    environment:
      POSTGRES_DB: rinde_trip
      POSTGRES_USER: rinde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinde -d rinde_trip"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-trip-data:/var/lib/postgresql/data
  trip:
    image: rinde/trip:${TRIP_VERSION:-0.2.0}
    build:
      context: .
      dockerfile: services/trip/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres-trip:5432/rinde_trip
      DB_USERNAME: rinde
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Configurar JWT_SECRET}
      RINDE_PLATFORM_JWT_SECRET: ${RINDE_PLATFORM_JWT_SECRET:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Configurar RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Configurar RABBITMQ_PASSWORD}
      IAM_SERVICE_URL: http://iam:8081
      FLEET_SERVICE_URL: http://core:8080
    ports:
      - "127.0.0.1:${TRIP_PORT:-8082}:8082"
    depends_on:
      postgres-trip:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  gateway:
    image: rinde/gateway:${GATEWAY_VERSION:-0.2.0}
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?Configurar JWT_SECRET}
      RINDE_PLATFORM_JWT_SECRET: ${RINDE_PLATFORM_JWT_SECRET:-}
      IAM_SERVICE_URL: http://iam:8081
      MONOLITH_URL: http://core:8080
      TRIP_SERVICE_URL: http://trip:8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    depends_on:
      - iam
      - core
      - trip
volumes:
  rabbitmq-data:
  postgres-core-data:
  postgres-iam-data:
  postgres-trip-data:
