# Único archivo de configuración. Completa username, password y secret en tu copia local y no subas esos datos.
spring:
  application:
    name: rinde
  datasource:
    url: jdbc:postgresql://localhost:5432/rinde
    username:
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  # Cada bounded context declara su propio Flyway (esquema y migraciones propios).
  flyway:
    enabled: false

server:
  port: 8080

rinde:
  security:
    jwt:
      # Mínimo 32 caracteres.
      secret:
      expiration-hours: 8
  iam:
    tokens:
      invitation-validity-hours: 48
      password-reset-validity-hours: 1
      email-verification-validity-hours: 48

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
